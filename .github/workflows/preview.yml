name: Preview changes

# Every draft the CMS creates is a pull request. This builds the real site for it, publishes it to
# Cloudflare Pages at its own address, and tells the CMS where it is (the "View Preview" button).
# If the build fails, it explains in plain language what to fix.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   secret   CLOUDFLARE_API_TOKEN       token with "Cloudflare Pages: Edit"
#   secret   CLOUDFLARE_ACCOUNT_ID
#   variable CLOUDFLARE_PAGES_PROJECT   the Pages project name (create it empty: wrangler pages project create)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # to add the Spanish and French translations to the draft
  pull-requests: write
  statuses: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the draft's own branch (not the merge result) so translations can be added to it.
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci fails on Linux: the lockfile (generated on macOS) omits optional @emnapi packages.
      - run: npm install --no-audit --no-fund

      # Say right away that the preview is being made. Merging is blocked until this becomes "success" (see docs/CMS.md),
      # which only happens after the translation has been committed to the draft.
      - name: Mark the preview as in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=pending -f context='cloudflare-pages/preview' \
            -f description='Building the preview and the Spanish and French versions. Wait for this to finish before publishing.'

      # Free machine translation (DeepL API Free) of whatever English content this draft changed. The result is
      # committed to the draft so the reviewer sees it in the diff and in the preview. Skipped when no key is set.
      - name: Translate changed content into Spanish and French
        id: translate
        if: env.DEEPL_AUTH_KEY != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/translate.mjs --base "origin/${{ github.base_ref }}"
          if [ -n "$(git status --porcelain src/content)" ]; then
            # If the draft was published or deleted while this ran, pushing would recreate its branch (a stray branch
            # holding a commit that never reaches main). Leave it to the catch-up workflow instead.
            if [ "$(gh pr view ${{ github.event.pull_request.number }} --json state --jq .state)" != "OPEN" ]; then
              echo "This draft is no longer open, so the translation was not pushed to it."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # -A on the folder that exists (a translation folder may not exist yet, and git add fails on a missing path).
            git add -A src/content
            git commit -m "Translate changed content into Spanish and French (machine translation, needs review)"
            git push
            echo "added=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          # A preview must never show up in search results.
          PUBLIC_NOINDEX: '1'

      - name: Publish the preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true

      - name: Tell the CMS where the preview is
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          # The draft may have gained a translation commit, so use its current head, which is what the CMS reads.
          SHA=$(git rev-parse HEAD)
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success -f context='cloudflare-pages/preview' \
            -f description='Preview is ready' -f target_url="$URL"
          note=""
          if [ "${{ steps.translate.outcome }}" = "failure" ]; then
            note=$'\n\n**Automatic Spanish and French translation did not complete.** Nothing was added to this draft. A developer can see why in the workflow log.'
          fi
          if [ "${{ steps.translate.outputs.added }}" = "1" ]; then
            note=$'\n\nSpanish and French versions of the changed content were drafted automatically and added to this draft. They stay hidden from search engines until a bilingual AA member reviews them.'
          fi
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --body "Preview ready: $URL$note"

      - name: Explain a failed build in plain language
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          problem=$(grep -m1 -E 'is not valid' build.log || grep -m1 -iE 'error' build.log || echo 'The site could not be built.')
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure -f context='cloudflare-pages/preview' \
            -f description='Something in this change needs fixing'
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "**This change can't be previewed yet.** A field has a mistake. Please open the draft in the CMS, fix it, and save again.

          What the site said: \`$problem\`"
