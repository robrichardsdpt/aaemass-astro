name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild so the events fetched at build time (Google Calendar, WordPress) stay current.
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci fails on Linux: the lockfile (generated on macOS) omits optional @emnapi packages.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GH_PAGES: '1'
          # The preview must never compete with aaemass.org in search results.
          PUBLIC_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
