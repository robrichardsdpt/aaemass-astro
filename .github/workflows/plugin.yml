name: Build WordPress plugin

# Every time a change is merged (or weekly, to refresh the events list fetched at build time), build the
# installable aa30-home.zip and publish it as the "plugin-latest" release, named after its version (2.0.<build>).
# The plugin on the live WordPress site checks that release hourly and installs it by itself (includes/updater.php).
# Merging into main is the approval step, and only the owner can approve (see .github/CODEOWNERS).

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

permissions:
  contents: write

concurrency:
  group: plugin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The signing key is a secret of this environment, which only the main branch may use (repo Settings > Environments).
    # A branch that edits this workflow and runs it cannot reach the key, so it cannot produce an installable release.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci fails on Linux: the lockfile (generated on macOS) omits optional @emnapi packages.
      - run: npm install --no-audit --no-fund
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Test the plugin
        run: |
          php wp-plugin/tests/run.php
          for f in $(find wp-plugin/aa30-home -name '*.php'); do php -l "$f" >/dev/null; done
      # WordPress offers an update only when the version number goes up, so every build gets the next one.
      - name: Stamp the version
        run: |
          echo "VERSION=2.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i "s/^ \* Version: .*/ * Version: 2.0.${{ github.run_number }}/" wp-plugin/aa30-home/aa30-home.php
          grep -m1 'Version:' wp-plugin/aa30-home/aa30-home.php
      - name: Test the scripts
        run: |
          for f in scripts/*.test.mjs; do node "$f"; done
      - name: Type-check the site
        run: npx astro check
      - name: Build the plugin
        run: ./build-plugin.sh
      - name: Sign the plugin
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          node scripts/sign-plugin.mjs sign aa30-home.zip "$VERSION" aa30-home.sig
          # Check it against the public key in the plugin before publishing: a wrong or missing secret stops here,
          # and the previous release stays in place.
          node scripts/sign-plugin.mjs verify aa30-home.zip "$VERSION" aa30-home.sig
      - name: Check the zip before publishing it
        run: |
          unzip -l aa30-home.zip | tail -1
          # A form or a missing page here would mean something went wrong.
          unzip -p aa30-home.zip 'aa30-home/dist/contact/index.html' | grep -q 'mailto:' 
          ! unzip -p aa30-home.zip 'aa30-home/dist/contact/index.html' | grep -q 'data-live-form'
      - name: Publish as the latest plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'): $(git log -1 --format=%s)"
          if gh release view plugin-latest >/dev/null 2>&1; then
            gh release upload plugin-latest aa30-home.zip aa30-home.sig --clobber
            gh release edit plugin-latest --title "$VERSION" --notes "$notes"
          else
            gh release create plugin-latest aa30-home.zip aa30-home.sig --title "$VERSION" --notes "$notes" --target "$GITHUB_SHA"
          fi
          echo "Download: https://github.com/${{ github.repository }}/releases/download/plugin-latest/aa30-home.zip" >> "$GITHUB_STEP_SUMMARY"
