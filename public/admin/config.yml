          - { label: 'Small label above the heading', name: eyebrow, widget: string }
          - { label: 'Intro sentence', name: lede, widget: text }
          - { label: 'Hidden heading for the introduction', name: aboutHidden, widget: string, hint: 'Read by screen readers only.' }
          - { label: 'Introduction, first paragraph', name: intro1, widget: text }
          - { label: 'Introduction, second paragraph', name: intro2, widget: text, hint: 'Special codes: `[[delegate|Delegate]]` shows a definition popup, `[words](https://...)` makes a link, and `{email}` or `{registrarEmail}` are filled in automatically. Leave them as they are.' }
          - { label: 'Label above the list of sections', name: jump, widget: string }
          - { label: 'Link to the full committee page', name: full, widget: string, hint: 'Use {title} where the committee name should go.' }
          - { label: 'Email button text', name: email, widget: string, hint: 'Use {email} where the address should go.' }
          - { label: 'Note under quotations', name: quoteNote, widget: string, hint: 'Usually empty.', required: false }
          - label: 'Committees and reports'
            name: sections
            widget: list
            collapsed: true
            label_singular: 'Committee'
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: title, widget: string, hint: 'The page links to each section by this title.' }
              - { label: Paragraphs, name: paras, widget: list, label_singular: Paragraph, hint: 'Starting a paragraph with @en: keeps it in English on every language (used for quotations).', field: { label: Paragraph, name: para, widget: text } }
              - { label: 'Email address', name: contact, widget: string, hint: 'Adds an email button at the end of the section.', required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a full email address'] }
          - label: Extra sections
            name: extra_blocks
            widget: list
            collapsed: true
            label_singular: Section
            required: false
            summary: '{{fields.type}}: {{fields.heading}}{{fields.title}}{{fields.text}}'
            hint: 'Add your own sections at the bottom of the page, above the footer. Drag to reorder. Spanish and French versions are machine translated automatically and need review.'
            types: *block_types
