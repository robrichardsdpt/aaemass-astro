# Decap CMS: edit pages, events and the menu at /admin/.
# Local editing:  npm run cms   (in one terminal)  +  npm run dev  (in another), then open /admin/.
# Production editing needs a GitHub OAuth proxy; see docs/CMS.md.
backend:
  name: github
  repo: robrichardsdpt/aaemass-astro
  branch: main
  base_url: https://area30-decap-oauth.robrichardsdpt.workers.dev
  # Decap shows a "View Preview" link on each draft when the preview workflow posts a commit status with this name.
  preview_context: cloudflare-pages/preview
  # Least privilege: the repository is public, so editors only need to grant access to public repositories. Without this,
  # Decap asks GitHub for the broad "repo" scope (all of an editor's private repositories too). If the repository is ever made
  # private, change this to "repo" (and the scope in oauth-worker/index.js).
  auth_scope: public_repo

local_backend: true
# Edits are saved as drafts (a pull request). Nothing goes live until someone approves and publishes.
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
site_url: https://robrichardsdpt.github.io/aaemass-astro/
display_url: https://robrichardsdpt.github.io/aaemass-astro/

collections:
  - name: pages
    label: Pages
    label_singular: Page
    description: 'Build a page from blocks. Drag blocks by their handle to reorder them. New here? Read the [editor guide](help.html).'
    folder: src/content/pages
    extension: yml
    format: yml
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields: &page_fields
      - { label: Title, name: title, widget: string, hint: 'Shown as the page heading. Keep it under 60 characters for search results.', pattern: ['^.{1,70}$', 'Keep the title under 60 characters'] }
      - { label: Search description, name: description, widget: text, hint: 'One or two sentences, 120 to 160 characters.', pattern: ['^[\s\S]{100,175}$', 'Aim for 120 to 160 characters so search engines show it in full'] }
      - { label: Small label above the title, name: eyebrow, widget: string, required: false }
      - { label: Intro sentence, name: lede, widget: text, required: false }
      - { label: Hide from search engines, name: noindex, widget: boolean, default: false, required: false }
      - label: Remove from the website
        name: removed
        widget: boolean
        default: false
        required: false
        hint: 'Tick this and save to take this page off the website. Use this instead of the Delete button (Delete cannot work on published entries). After you publish, it disappears from the site and a follow-up change deletes its files for the owner to approve.'
      - label: Blocks
        name: blocks
        widget: list
        label_singular: Block
        summary: '{{fields.type}}: {{fields.heading}}{{fields.title}}{{fields.text}}'
        hint: Add blocks and drag them into order.
        types: &block_types
          - label: Text
            name: text
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], modes: [rich_text], editor_components: [], hint: 'Links to pages on this site: /contact/' }
          - label: Cards
            name: cards
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: intro, widget: text, required: false }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: Link text, name: link_text, widget: string, required: false }
                  - { label: Link address, name: link_url, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'], required: false, hint: '/committees/ for this site, or a full https:// address' }
          - label: Callout box
            name: callout
            widget: object
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Text, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], modes: [rich_text], editor_components: [] }
          - label: Image and text
            name: split
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], modes: [rich_text], editor_components: [] }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Image description (for screen readers), name: image_alt, widget: string, required: false, hint: 'A few words describing the picture for people who cannot see it. Fill this in whenever there is an image.' }
              - { label: Put image on the right, name: flip, widget: boolean, default: false, required: false }
              - { label: Button text, name: button_label, widget: string, required: false }
              - { label: Button address, name: button_url, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'], required: false }
          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false, hint: 'Defaults to Frequently asked questions' }
              - label: Questions
                name: items
                widget: list
                fields:
                  - { label: Question, name: q, widget: string }
                  - { label: Answer, name: a, widget: text, hint: 'Plain text. Also used for search and AI answers.' }
          - label: Contact list
            name: directory
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: intro, widget: text, required: false }
              - label: People or committees
                name: items
                widget: list
                fields:
                  - { label: Name, name: title, widget: string }
                  - { label: Email, name: email, widget: string, required: false }
                  - { label: Website, name: url, widget: string, required: false, pattern: ['^https?://', 'Start with https://'] }
                  - { label: Note, name: note, widget: string, required: false }
          - label: Meeting details
            name: meeting
            widget: object
            fields:
              - { label: Title, name: title, widget: string, required: false, hint: 'Defaults to When does it meet?' }
              - label: Lines
                name: lines
                widget: list
                field: { label: Line, name: line, widget: string }
              - { label: Online meeting link, name: join_url, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'], required: false }
              - { label: Show a calendar button, name: show_calendar_link, widget: boolean, default: true, required: false }
          - label: Link pills
            name: links
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Links
                name: items
                widget: list
                fields:
                  - { label: Text, name: label, widget: string }
                  - { label: Address, name: url, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'] }
          - label: Quote
            name: quote
            widget: object
            fields:
              - { label: Quote, name: text, widget: text }
              - { label: Who said it, name: by, widget: string, required: false }
          - label: Buttons
            name: buttons
            widget: object
            fields:
              - label: Buttons
                name: items
                widget: list
                fields:
                  - { label: Text, name: label, widget: string }
                  - { label: Address, name: url, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'] }
                  - { label: Style, name: style, widget: select, options: [primary, quiet], default: primary, required: false }
          - label: Checklist
            name: checklist
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Items
                name: items
                widget: list
                field: { label: Item, name: item, widget: string }
          - label: Upcoming events
            name: events
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false, hint: 'Defaults to Upcoming events' }
              - { label: How many to show, name: count, widget: number, value_type: int, min: 1, max: 12, default: 6, required: false }

  - name: pages_es
    label: Páginas (español)
    label_singular: Página en español
    description: Spanish copies of the pages. Use the same file name as the English page. Machine translations stay hidden from search engines until a bilingual AA member lists them in src/i18n/reviewed.json (see docs/TRANSLATION.md).
    folder: src/content/pages-i18n/es
    extension: yml
    format: yml
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields: *page_fields
  - name: pages_fr
    label: Pages (français)
    label_singular: Page en français
    description: French copies of the pages. Use the same file name as the English page. Machine translations stay hidden from search engines until a bilingual AA member lists them in src/i18n/reviewed.json (see docs/TRANSLATION.md).
    folder: src/content/pages-i18n/fr
    extension: yml
    format: yml
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields: *page_fields
  - name: events
    label: Events
    label_singular: Event
    description: 'Highlighted events. They show first in Explore events on the Calendar page and get their own page. Weekly and monthly meetings that repeat belong in the Google Calendar instead. Past events drop off automatically.'
    folder: src/content/events
    extension: md
    format: frontmatter
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    summary: '{{title}} ({{date}})'
    sortable_fields: [date, title]
    editor:
      preview: false
    fields:
      - { label: Event name, name: title, widget: string }
      - { label: One-sentence summary, name: summary, widget: text, hint: 'Used in search results and the event list.' }
      - { label: Date, name: date, widget: eventdate, hint: 'The first day of the event.' }
      - { label: All-day event, name: all_day, widget: boolean, default: false, required: false, hint: 'Tick this if there is no set time. You can then skip the times below.' }
      - { label: Starts at, name: start_time, widget: eventtime, required: false, hint: 'Eastern time. Required unless it is an all-day event.' }
      - { label: Ends at, name: end_time, widget: eventtime, required: false, hint: 'Optional. Eastern time.' }
      - { label: Last day, name: end_date, widget: eventdate, required: false, hint: 'Only if the event runs past midnight or over several days. Leave blank for a one-day event.' }
      - { label: Place name, name: location_name, widget: string, required: false }
      - { label: Street address, name: address, widget: string, required: false }
      - { label: Online link, name: online_url, widget: string, required: false, pattern: ['^https?://', 'Start with https://'] }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image description (for screen readers), name: image_alt, widget: string, required: false, hint: 'A few words describing the picture for people who cannot see it. Fill this in whenever there is an image.' }
      - { label: Details, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], modes: [rich_text], editor_components: [], required: false }
      - label: Remove from the website
        name: removed
        widget: boolean
        default: false
        required: false
        hint: 'Tick this and save to take this event off the website. Use this instead of the Delete button (Delete cannot work on published entries). After you publish, it disappears from the site and a follow-up change deletes its files for the owner to approve.'

  - name: committees
    label: Committees
    label_singular: Committee
    description: 'Add or edit a committee here. Changes update the committee page, the committees list on the home page and the Contact page. A new committee appears in English in Spanish and French until a translator adds those versions.'
    folder: src/content/committees
    extension: yml
    format: yml
    create: true
    slug: '{{slug}}'
    summary: '{{title}} ({{group}})'
    sortable_fields: [order, title]
    editor:
      preview: false
    fields:
      - { label: Committee name, name: title, widget: string, hint: 'For example: Archives. The page title becomes "<name> Committee".' }
      - { label: Short name, name: short_name, widget: string, required: false, hint: 'Optional, like C.P.C. Used on tiles when set.' }
      - { label: Email, name: email, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a full email address'], hint: 'Shown on the committee page and the Contact page.' }
      - label: Type
        name: group
        widget: select
        options: [{ label: Conference committee, value: conference }, { label: Standing committee, value: standing }]
        hint: 'Decides which list it appears in on the Contact page.'
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, hint: 'Lower numbers are listed first. Existing committees go up by 10, so pick a number in between to place a new one.' }
      # Developer-only settings. Hidden (not removed) so saving a committee in the CMS keeps their values.
      - { label: Where it is listed, name: listing, widget: hidden, default: list }
      - { label: Tile picture, name: tile_image, widget: hidden, required: false }
      - { label: Page, name: page_type, widget: hidden, default: standard }
      - { label: Small label above the title, name: eyebrow, widget: string, required: false, hint: 'Required if the committee has its own page.' }
      - { label: Intro sentence, name: lede, widget: text, required: false, hint: 'Required if the committee has its own page.' }
      - { label: Search description, name: description, widget: text, required: false, hint: 'One or two sentences, 120 to 160 characters. Required if the committee has its own page.', pattern: ['^[\s\S]{100,175}$', 'Aim for 120 to 160 characters so search engines show it in full'] }
      - { label: Search title (optional), name: seo_title, widget: string, required: false, hint: 'Leave blank to use "<name> Committee | Area 30 Eastern Mass. AA".' }
      - label: Quote
        name: quote
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Quote, name: text, widget: text }
          - { label: Who said it, name: by, widget: string }
      - label: Sections
        name: sections
        widget: list
        collapsed: true
        required: false
        label_singular: Section
        summary: '{{fields.title}}'
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Paragraphs
            name: paras
            widget: list
            required: false
            field: { label: Paragraph, name: para, widget: text }
          - label: Bullet points
            name: items
            widget: list
            required: false
            field: { label: Point, name: item, widget: string }
          - label: Links
            name: links
            widget: list
            required: false
            fields:
              - { label: Text, name: text, widget: string }
              - { label: Address, name: href, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'], hint: '/page-name/ for this site, or a full https:// address' }
      - label: Monthly meeting (for search engines)
        name: schedule
        widget: object
        collapsed: true
        required: false
        hint: 'Fill in if the committee meets on the same weekday each month.'
        fields:
          - { label: Weekday, name: weekday, widget: select, options: [{ label: Sunday, value: 0 }, { label: Monday, value: 1 }, { label: Tuesday, value: 2 }, { label: Wednesday, value: 3 }, { label: Thursday, value: 4 }, { label: Friday, value: 5 }, { label: Saturday, value: 6 }], value_type: int }
          - { label: Which one in the month, name: week, widget: select, options: [{ label: 1st, value: 1 }, { label: 2nd, value: 2 }, { label: 3rd, value: 3 }, { label: 4th, value: 4 }], value_type: int }
          - { label: Start time (24-hour, Eastern), name: time, widget: string, pattern: ['^\d{2}:\d{2}$', 'Use 24-hour time like 19:30'] }
      - label: Meeting box
        name: meeting
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Intro, name: intro, widget: text, required: false }
          - label: Chips
            name: chips
            widget: list
            required: false
            field: { label: Chip, name: chip, widget: string }
          - label: Lines
            name: lines
            widget: list
            field: { label: Line, name: line, widget: string }
          - label: Join link
            name: join
            widget: object
            required: false
            fields:
              - { label: Button text, name: text, widget: string }
              - { label: Address, name: href, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'] }
          - { label: Show a calendar button, name: calendar, widget: boolean, default: true, required: false }
      - { label: Call to action, name: cta, widget: text, required: false, hint: 'The sentence above the email button. Required if the committee has its own page.' }
      - label: Related link
        name: more
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Text, name: text, widget: string }
          - { label: Address, name: href, widget: string, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'] }
      - label: Remove from the website
        name: removed
        widget: boolean
        default: false
        required: false
        hint: 'Tick this and save to take this committee off the website. Use this instead of the Delete button (Delete cannot work on published entries). After you publish, it disappears from the site and a follow-up change deletes its files for the owner to approve.'

  - name: districts
    label: Districts
    label_singular: District
    description: 'When and where each district meets. Each district is one card on the Districts page. Fill in the sections below and the card is written for you, in English, Spanish and French.'
    folder: src/content/districts
    extension: yml
    format: yml
    create: true
    slug: '{{slug}}'
    summary: '{{name}}'
    sortable_fields: [order, name]
    editor:
      preview: false
    fields:
      - { label: District name, name: name, widget: string, hint: 'For example: District 7, or District 12 & 13.' }
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, hint: 'Lower numbers come first. Districts go up by 10, so pick a number in between to place a new one.' }
      - label: When it meets
        name: meeting
        widget: object
        required: false
        hint: 'Leave empty only if the card is written in the Other lines box at the bottom.'
        fields:
          - { label: How, name: how, widget: select, options: [{ label: In person and online (hybrid), value: hybrid }, { label: Online only, value: virtually }, { label: In person only, value: in person }] }
          - { label: Which one in the month, name: week, widget: select, value_type: int, options: [{ label: 1st, value: 1 }, { label: 2nd, value: 2 }, { label: 3rd, value: 3 }, { label: 4th, value: 4 }] }
          - { label: Weekday, name: weekday, widget: select, options: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday] }
          - { label: Starts at, name: start, widget: eventtime, hint: 'Eastern time.' }
          - { label: Ends at, name: end, widget: eventtime, required: false }
          - { label: Note, name: note, widget: string, required: false, hint: 'Optional, shown in brackets. For example: if the 1st Monday falls on a holiday, the meeting will be held the 2nd Monday of the month.' }
      - label: Online meeting
        name: online
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Platform, name: platform, widget: string, required: false, hint: 'For example: Zoom.' }
          - { label: Meeting ID, name: id, widget: string, required: false }
          - { label: Password or passcode, name: password, widget: string, required: false }
          - { label: Called, name: password_label, widget: select, options: [Password, Passcode], default: Password, required: false }
          - { label: Email for the password, name: password_email, widget: string, required: false, hint: 'Use this instead of a password when people must ask for it.', pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a full email address'] }
          - { label: Email for more information, name: info_email, widget: string, required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a full email address'] }
      - label: In-person meeting
        name: in_person
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Place name, name: place, widget: string, required: false }
          - { label: Street address, name: address, widget: string, required: false }
      - { label: District website, name: website, widget: string, required: false, pattern: ['^https?://', 'Start with https://'] }
      - { label: Mail contributions to, name: mail, widget: string, required: false, hint: 'The address only. For example: P.O. Box 1, Town, MA 01234. "Please mail contributions to:" is added for you.' }
      - { label: Make checks payable to, name: payable_to, widget: string, required: false }
      - label: Other lines
        name: extra_lines
        widget: list
        required: false
        collapsed: true
        label_singular: Line
        hint: 'Only for anything that does not fit above. One line each. These stay in English on the Spanish and French pages unless a developer adds a translation.'
        field: { label: Line, name: line, widget: string }
      - label: Remove from the website
        name: removed
        widget: boolean
        default: false
        required: false
        hint: 'Tick this and save to take this district off the website. Use this instead of the Delete button (Delete cannot work on published entries). After you publish, it disappears from the site and a follow-up change deletes its files for the owner to approve.'

  - name: settings
    label: Site settings
    editor:
      preview: false
    files:
      - name: navigation
        label: Main menu
        file: src/content/settings/navigation.yml
        description: 'Drag to reorder. Use /page-name/ for pages on this site, or @documents for the Area 30 documents folder.'
        fields:
          - label: Menu items
            name: items
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Address, name: url, widget: string, pattern: ['^(/|https?://|@documents$)', 'Use /page-name/ for this site, https:// for another site, or @documents'] }
      - name: contact
        label: Contact details and officers
        file: src/content/site/contact.yml
        description: 'The general email, Registrar email, mailing address and the officer emails shown on the Contact page, footer and Registrar page.'
        fields:
          - { label: General email, name: email, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a full email address'] }
          - { label: Registrar email, name: registrar_email, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a full email address'] }
          - label: Mailing address
            name: address
            widget: object
            fields:
              - { label: Street or P.O. Box, name: street, widget: string }
              - { label: City, name: city, widget: string }
              - { label: State, name: region, widget: string }
              - { label: ZIP code, name: postal_code, widget: string }
          - label: Officer emails
            name: officers
            widget: object
            fields:
              - { label: Delegate, name: delegate, widget: string }
              - { label: Alternate Delegate, name: altdelegate, widget: string }
              - { label: Area Chair, name: chair, widget: string }
              - { label: Alternate Area Chair, name: altchair, widget: string }
              - { label: Area Secretary, name: secretary, widget: string }
              - { label: Area Treasurer, name: treasurer, widget: string }

      - name: notice
        label: Site notice
        file: src/content/site/notice.yml
        description: 'A short message shown in a bar at the top of every page, for example a cancelled assembly or a changed Zoom link. Leave the message empty to show nothing. It appears in English on every language version.'
        fields:
          - { label: Message, name: text, widget: string, required: false, hint: 'One sentence. Clear this box to remove the notice.' }
          - { label: Link text, name: link_text, widget: string, required: false, hint: 'For example: See the details. Defaults to Read more.' }
          - { label: Link address, name: link_url, widget: string, required: false, pattern: ['^(/|https?://|mailto:|tel:)', 'Start with / for a page on this site, or https:// for another site'] }
          - { label: Last day to show it, name: until, widget: eventdate, required: false, hint: 'Optional. The notice is removed the first time the site is rebuilt after this day (the site rebuilds every morning and whenever a change is published).' }

      - name: home
        label: 'Home page'
        file: src/content/site/home.yml
        description: 'The page in English. Spanish and French wording is generated automatically (machine translation, needs review before it is shown to search engines).'
        fields:
          - { label: 'Search title', name: title, widget: string, hint: 'Under 60 characters.', pattern: ['^.{1,70}$', 'Keep the title under 60 characters'] }
          - { label: 'Search description', name: description, widget: text, hint: '120 to 160 characters.', pattern: ['^[\s\S]{100,175}$', 'Aim for 120 to 160 characters so search engines show it in full'] }
          - { label: 'Small label above the headline', name: eyebrow, widget: string }
          - { label: 'Headline', name: h1, widget: string }
          - { label: 'Intro sentence', name: lede, widget: text }
          - { label: 'Button: find a meeting', name: findMeeting, widget: string }
          - { label: 'Button: see the calendar', name: seeCalendar, widget: string }
          - label: 'Mailing list box'
            name: signup
            widget: object
            collapsed: true
            fields:
              - { label: 'Heading', name: title, widget: string }
              - { label: 'Text', name: text, widget: text }
              - { label: 'Email field label', name: emailLabel, widget: string }
              - { label: 'Button text', name: submit, widget: string }
          - label: 'About Area 30'
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: 'Picture description', name: imageAlt, widget: string, hint: 'For screen readers.' }
