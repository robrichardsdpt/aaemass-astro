sourceHash: 2430ff080f2e003e
title: Engagez-vous dans le bénévolat | Région 30
description: Comment s'impliquer dans les activités de service des A.A. dans l'est du Massachusetts, depuis votre groupe d'appartenance jusqu'aux comités de la Région 30 et à la Conférence des services généraux.
eyebrow: Service
lede: Le meilleur point de départ, c'est votre groupe d'appartenance. De là, le chemin vers le service est tout proche.
blocks:
  - type: text
    heading: Pourquoi le service ?
    body: |
      Les membres des A.A. travaillent ensemble pour venir en aide à l’alcoolique qui souffre encore, et s’entraider est essentiel pour rester sobre.

      Le service prend de nombreuses formes : installer des chaises, occuper le poste de Représentant des services généraux (RSG) de votre groupe ou rejoindre un comité de la Région 30.
  - type: cards
    heading: Par où commencer ?
    cards:
      - title: Votre groupe d'appartenance
        text: Renseignez-vous sur les postes disponibles dans le domaine du service, de l'accueil au RSG.
        link_text: Trouver une réunion
        link_url: https://aaboston.org/meetings
      - title: Un arrondissement
        text: Les districts rassemblent les groupes voisins. Votre RSG participe aux réunions de district.
        link_text: Découvrez les quartiers
        link_url: /districts/
      - title: Un comité de la Région 30
        text: Ces comités diffusent ce message dans les prisons, les centres de traitement, les établissements scolaires et auprès des professionnels.
        link_text: Parcourir les commissions
        link_url: /committees/
      - title: Un nouveau RSG ?
        text: Commencez par découvrir ici le rôle d'un RSG et comment s'inscrire, puis découvrez le déroulement d'une Assemblée de région.
        link_text: Nouveau guide RSG
        link_url: /new-gsr/
  - type: callout
    title: Vous ne savez pas trop où vous vous situez ?
    body: Envoyez-nous un e-mail à l'adresse [info@aaemass.org](mailto:info@aaemass.org), et nous vous orienterons vers un comité qui a besoin de vos compétences.
  - type: faq
    items:
      - q: Dois-je être sobre depuis un certain temps pour m'engager dans le service ?
        a: Les conditions requises varient selon le poste. De nombreuses fonctions de service, telles que l'accueil des nouveaux venus ou l'aide lors d'un événement, sont ouvertes à tout membre de l'A.A. Les présidents de comité et les responsables peuvent être soumis à des conditions de sobriété fixées par la région.
      - q: Combien de temps dure l'intervention ?
        a: Cela dépend du rôle. Les comités se réunissent généralement une fois par mois, et l'aide à l'organisation d'un événement peut se limiter à un seul après-midi.
