sourceHash: 55546b687e456481
title: Commencez ici, nouveau RSG | Région 30
description: Le rôle d'un représentant des services généraux (RSG), la procédure à suivre pour devenir représentant dans l'est du Massachusetts, où trouver le numéro de service de votre groupe et qui peut vous aider à vous lancer.
eyebrow: Impliquez-vous
lede: Votre groupe vous a choisi(e) pour assurer le lien avec le reste des A.A. Voici ce que cela implique et comment vous organiser.
blocks:
  - type: text
    heading: Le rôle d'un RSG
    body: |
      Le représentant des services généraux (RSG) fait le lien entre votre groupe et l’ensemble des A.A. Vous vous faites le porte-parole de la conscience de groupe et vous transmettez ce que vous apprenez afin que le groupe reste informé.

      Concrètement, cela signifie :

      - **Assister à la réunion de votre district** et faire part de l’avis de votre groupe au membre du comité de district (MCD).
      - **Participer à l’Assemblée de région**, où vous disposez d’un droit de vote. C’est également là que vous rencontrez le Délégué de région, qui transmet les points de vue des groupes à la Conférence des services généraux.
      - **Rendez compte à votre groupe** de ce qui se passe dans le district, la région et au sein des A.A. à l’échelle mondiale.
      - **Aidez votre groupe à soutenir les services.** Collaborez avec votre trésorier pour mettre en place un plan de contributions régulières au profit du district, de la région, de votre bureau central local ou de votre intergroupe, ainsi que du Bureau des services généraux.
      - **Aidez les nouveaux groupes** qui se forment à proximité à découvrir les services mis à leur disposition.

      Mais avant tout, un RSG sait écouter. Toute l’autorité qui existe au sein des A.A. réside dans la Conscience de groupe, et votre rôle est de veiller à ce qu’elle soit entendue.
  - type: checklist
    heading: Vos premiers pas
    items:
      - Indiquez à votre MCD que vous êtes le nouveau RSG de votre groupe. Il transmettra vos coordonnées au Registraire de la zone. Vous ne savez pas qui est votre MCD ? Retrouvez votre district sur la page des districts.
      - Ou inscrivez-vous lors de n'importe quelle Assemblée de région, au bureau des inscriptions.
      - Retrouvez le numéro d'enregistrement de votre groupe. Adressez-vous à votre MCD, au Registraire de la zone ou au trésorier de la zone. Vous en aurez besoin pour tout envoi destiné à la Région 30 ou au Bureau des services généraux à New York ; sans ce numéro, votre groupe ne pourra pas être crédité de ses contributions.
      - Attendez de recevoir le dossier RSG. Une fois votre inscription effectuée, le Bureau des services généraux en envoie un aux nouveaux RSG et à leurs groupes.
      - Choisissez une date pour votre première réunion de district et votre première assemblée de région (voir le guide de l'assemblée de région).
  - type: buttons
    items:
      - label: Trouvez votre arrondissement
        url: /districts/
        style: primary
      - label: Veuillez contacter le Registraire
        url: /committees/registrar/
        style: quiet
      - label: Guide d'assemblage de région
        url: /area-assembly/
        style: quiet
  - type: callout
    title: L'inscription auprès du siège social constitue une étape distincte
    body: L'inscription de votre groupe auprès de votre bureau central de service local ou de votre intergroupe ne concerne que ce bureau. Elle n'entraîne pas la mise à jour des informations au niveau de la région, de votre district ou du Bureau des services généraux à New York. Il s'agit de registres distincts ; vous devez donc mettre à jour chacun d'entre eux.
  - type: text
    heading: Trouver un parrain de service
    body: |
      Tout comme vous aviez besoin de quelqu’un qui avait déjà vécu cette expérience lorsque vous avez arrêté de boire, il est utile d’avoir à vos côtés une personne qui a déjà occupé un poste de service. Les nouveaux RSG sont souvent submergés par les nouveaux termes, la documentation et les questions : par où commencer, comment présenter un rapport, comment intégrer tout cela dans une vie bien remplie ? Beaucoup abandonnent au bout d’un mois ou deux parce qu’ils n’avaient personne à qui s’adresser.

      Votre parrain de service peut être un MCD expérimenté, un responsable de zone ou un ancien Délégué. Il n’est pas nécessaire qu’il s’agisse de votre parrain de rétablissement, et une femme peut parrainer un homme dans le cadre du service, et inversement. Vous pouvez le contacter aussi souvent ou aussi rarement que vous le souhaitez, et vous pouvez vous tourner vers une autre personne à mesure que votre engagement dans le service s'intensifie.

      Renseignez-vous lors de votre réunion de district, ou envoyez un e-mail à [info@aaemass.org](mailto:info@aaemass.org), et nous vous aiderons à trouver quelqu’un.
  - type: links
    heading: En savoir plus
    items:
      - label: Comité du séminaire de service
        url: /committees/service-seminar/
      - label: Devenez bénévole pour les activités liées aux 12 étapes
        url: /committees/treatment-facilities/12th-step-volunteer/
      - label: Toutes les possibilités de bénévolat
        url: /get-involved/
      - label: Bureau des services généraux des A.A.
        url: https://www.aa.org
  - type: faq
    items:
      - q: Que signifient ces abréviations ?
        a: RSG désigne le représentant des services généraux, MCD le membre du comité de district et BSG le Bureau des services généraux à New York. Vous trouverez une liste plus complète dans le glossaire du Manuel de la Région 30.
      - q: Dois-je être un expert avant de me lancer ?
        a: Non. Personne ne s'attend à ce que vous sachiez tout. Lisez les brochures des A.A. intitulées « Le groupe des A.A. » et « Le représentant des services généraux » (RSG), gardez votre sens de l'humour et posez des questions lors de votre réunion de district.
      - q: Quelle est la place du RSG au sein de la structure des services ?
        a: Cette structure commence au sein de votre groupe. Vous transmettez la Conscience de groupe à votre MCD et au Délégué de zone, et ce dernier la transmet à son tour à la Conférence des services généraux.
