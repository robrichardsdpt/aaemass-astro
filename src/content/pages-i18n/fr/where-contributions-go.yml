sourceHash: 4ccaa8454fe7f4cd
title: À quoi servent les cotisations ? | Région 30
description: Comment la Région 30 est financée par les groupes des A.A., comment le budget annuel est établi et approuvé, et pourquoi l'engagement de chacun ne devrait pas être limité par ses propres moyens financiers.
eyebrow: Contribuer
lede: La Région 30 est financée exclusivement par les groupes qu'elle soutient. Voici comment ces fonds sont planifiés, approuvés et utilisés.
blocks:
  - type: text
    heading: Financé par les groupes A.A.
    body: |
      Conformément à la Septième Tradition, la Région 30 est financée exclusivement par les contributions des groupes des A.A. situés sur son territoire.

      Le Comité des finances donne son avis sur les questions financières. Il est présidé par le trésorier de la région, et ses membres votants sont les responsables élus de la région et leurs suppléants, les présidents de la Conférence et des comités permanents (ou leurs suppléants) ainsi que le Délégué sortant. Ses procès-verbaux sont accessibles à toute personne qui en fait la demande.
  - type: timeline
    heading: Comment est établi le budget annuel ?
    steps:
      - when: Chaque année
        title: Les commissions indiquent le montant des dépenses qu'elles prévoient d'engager
        text: On demande à chaque commission d'indiquer ce dont elle estime avoir besoin pour l'année à venir. Ces dépenses courantes constituent le budget de fonctionnement général.
      - when: novembre
        title: La commission des finances présente une proposition
        text: Le projet de budget est soumis au comité régional.
      - when: Après novembre
        title: Les circonscriptions et les groupes en discutent
        text: La proposition est renvoyée aux districts et aux groupes pour y être discutée et examinée.
      - when: janvier
        title: L'Assemblée vote
        text: Le trésorier présente le budget lors de la première Assemblée de l'année. L'Assemblée peut l'approuver, le rejeter ou le modifier. Une fois approuvé, il devient le plan de fonctionnement de la région.
      - when: Tout au long de l'année
        title: Les demandes supplémentaires doivent également être approuvées
        text: Une demande ponctuelle, ou une demande complémentaire émanant d'une personne qui prévoit de dépasser son budget, est approuvée par la commission des finances, puis par l'Assemblée.
  - type: cards
    heading: Réserves et excédent
    intro: Les cotisations et les dépenses ne correspondent pas d'un mois à l'autre ; c'est pourquoi la région conserve une certaine somme en réserve. Le manuel précise les montants exacts et les règles applicables.
    cards:
      - title: Réserve d'exploitation
        text: De quoi couvrir les dépenses du mois en cours et du mois prochain, afin que les factures soient réglées à temps, quels que soient les revenus perçus ce mois-là.
      - title: Réserve de prudence
        text: Une réserve plus importante, fixée par l'Assemblée de région, qui permettrait d'assurer le fonctionnement de la région pendant environ six mois.
      - title: Fonds excédentaires
        text: Fonds conservés au-delà des deux réserves pendant au moins trois mois. Le trésorier en fait l'annonce lors d'une Assemblée de région afin qu'ils puissent être utilisés pour diffuser le message. Tout montant restant à la date fixée est versé au Bureau des services généraux au nom de la région.
  - type: checklist
    heading: La qualité du service ne devrait pas dépendre de vos moyens financiers
    items:
      - Les frais que vous engagez dans le cadre de votre activité professionnelle à la demande de la Région vous sont intégralement remboursés.
      - C'est à vous de décider si vous souhaitez être remboursé.
      - L'objectif est que toute personne désireuse et capable de s'engager puisse le faire, sans que sa situation financière ne constitue un obstacle.
      - Les responsables et les commissions sont libres de décider de l'utilisation de leurs fonds ; ils doivent toutefois les gérer avec prudence et en rendre compte.
      - Le service est une récompense en soi.
  - type: callout
    title: Prêt à apporter votre contribution ?
    body: Vous pouvez effectuer un don en ligne ou par courrier, ou poser une question au trésorier à l'adresse [treasurer@aaemass.org](mailto:treasurer@aaemass.org).
  - type: buttons
    items:
      - label: Comment contribuer
        url: /contribute/
        style: primary
      - label: Guide de la Région 30 (PDF)
        url: https://aaemass.org/wp-content/uploads/2022/12/Area-Handbook-Jan2022.pdf
        style: quiet
      - label: Glossaire
        url: /glossary/
        style: quiet
  - type: faq
    items:
      - q: Qui décide de l'affectation des fonds de la Région 30 ?
        a: L'Assemblée. Elle vote le budget chaque mois de janvier et approuve également les demandes ponctuelles et supplémentaires.
      - q: Puis-je consulter le procès-verbal de la commission des finances ?
        a: Oui. Les procès-verbaux sont conservés et peuvent être consultés par toute personne qui en fait la demande. Veuillez vous adresser au trésorier à l'adresse treasurer@aaemass.org.
      - q: Les personnes qui ne font pas partie des A.A. peuvent-elles apporter leur contribution ?
        a: Non. Conformément à la Septième Tradition, la Région 30 refuse toute contribution provenant de l'extérieur des A.A.
