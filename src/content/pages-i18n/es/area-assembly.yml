sourceHash: 11602c6a818b35fc
title: "La Asamblea de Área: guía para principiantes | Área 30"
description: Qué ocurre en una asamblea del Área 30, quiénes asisten, quiénes pueden votar y el ritmo anual habitual de las asambleas y los actos en el este de Massachusetts.
eyebrow: Participe
lede: Cinco veces al año, se reúnen grupos de todo el este de Massachusetts para compartir experiencias y contribuir a la labor del Delegado de área. Cualquier miembro de A.A. es bienvenido a asistir.
blocks:
  - type: text
    heading: Para qué sirve una Asamblea
    body: |
      El objetivo de la Asamblea de Área es el mismo que el de un grupo de A.A.: llevar el mensaje al alcohólico que aún sufre. Lo hace principalmente mediante la elección del Delegado que representa al Área en la Conferencia de Servicios Generales y manteniendo informados a los grupos, a los MCD y al Delegado sobre las actividades de A.A. a nivel local y mundial.

      Se trata de un órgano de servicio, nunca de un gobierno. Su función consiste en dar voz a todos los grupos, proteger el derecho de las minorías a ser escuchadas y garantizar que no se aprueben apresuradamente las propuestas de ninguna persona o grupo en particular.
  - type: assembly
  - type: callout
    title: Cualquier miembro de A.A. puede asistir, y cualquier miembro de A.A. tiene voz y voto
    body: No es necesario ser miembro del RSG para asistir o intervenir. Solo votan determinados servidores (véase más abajo), pero todas las personas presentes en la sala pueden intervenir. Las asambleas se celebran los domingos, normalmente en una sede de un distrito diferente cada vez.
  - type: timeline
    heading: Un día típico en la Asamblea
    intro: Los horarios y los temas concretos varían, por lo que le recomendamos que consulte el calendario para conocer la próxima sesión.
    steps:
      - when: 9:00 de la mañana
        title: Inscripción
      - when: 9:15 de la mañana
        title: Sesión de orientación para los nuevos RSG y MCD
        text: Un buen punto de partida si es la primera vez que visita esta página. Plantee aquí sus preguntas.
      - when: 10:00 de la mañana
        title: Apertura de la sesión e informes
        text: Lecturas, bienvenida y conmemoraciones de aniversarios, seguidas de los informes del secretario, del tesorero, del responsable de área y de los Delegados.
      - when: 10:30 de la mañana
        title: Asuntos pendientes y nuevos asuntos
      - when: 11:00 de la mañana
        title: Presentaciones
        text: Comisiones de la conferencia e informes sobre los eventos regionales.
      - when: 11:30 de la mañana
        title: Tema de la Asamblea
        text: A continuación, se servirá el almuerzo, a cargo del distrito anfitrión.
      - when: 13:00 h
        title: Continuación del tema y talleres
      - when: 15:30 h
        title: «Cesta de preguntas» y «¿Qué le preocupa?»
        text: Una oportunidad para plantear cualquier tema que aún no se haya tratado.
      - when: 16:00 h
        title: Aplazamiento
  - type: cards
    heading: ¿Quién se encuentra en la sala?
    intro: La Asamblea reúne a los servidores de confianza del Área.
    cards:
      - title: RSG
        text: Un voto por grupo, procedente de cada distrito. Se prevé que representen aproximadamente dos tercios de los miembros con derecho a voto.
      - title: MCD
        text: Los miembros del Comité de Distrito de los 26 distritos, además del distrito de habla hispana.
      - title: Agentes de zona
        text: Delegado, presidente, tesorero y secretario, cada uno con un suplente.
      - title: Presidentes de las comisiones
        text: Los presidentes de las comisiones de la Conferencia y los presidentes de las comisiones permanentes, o sus suplentes.
      - title: Enlaces e invitados
        text: Representantes de las asambleas de jóvenes, del Servicio Central de Boston, de los intergrupos y de otros miembros interesados. Participan, pero no tienen derecho a voto.
  - type: text
    heading: Cómo se toman las decisiones
    body: |
      El Área 30 sigue de forma flexible las «Reglas de Orden de Robert», con modificaciones que se ajustan al espíritu de A.A. Las votaciones se realizan a mano alzada o mediante papeleta, y cualquier cuestión relacionada con las normas requiere **una unanimidad sustancial**, lo que significa dos tercios de los votos de los miembros con derecho a voto presentes en la sala en el momento de la votación.

      Tras una votación importante, siempre se concede a la minoría la oportunidad de intervenir. A continuación, cualquier persona que haya votado con la mayoría y haya cambiado de opinión puede solicitar que se reconsidere la decisión.

      Las elecciones se rigen por el «Procedimiento del Tercer Legado» de A.A. (Alcoholics Anonymous), diseñado para evitar que ninguna facción imponga a la fuerza a un candidato. Un candidato necesita dos tercios de los votos, y si nadie alcanza esa cifra tras cinco votaciones, la elección se decide por sorteo.
  - type: timeline
    heading: Resumen de los 30 años del Área 30
    intro: El Área se reúne con la misma periodicidad cada año. Hay ligeras diferencias entre los años pares y los impares, sobre todo en noviembre.
    steps:
      - when: Enero
        title: Asamblea inaugural
        text: Las comisiones de la conferencia presentan sus informes y la Asamblea vota el presupuesto del Área para el año. [Vea a dónde van las contribuciones](/contribute/#where-contributions-go).
      - when: Febrero
        title: NERAASA
        text: La Asamblea Regional de Servicio A.A. del Noreste, celebrada el último fin de semana de febrero.
      - when: abril
        title: Asamblea previa a la conferencia
        text: Se celebra antes de que la Conferencia de Servicios Generales se reúna en Nueva York.
      - when: junio
        title: Asamblea posterior a la conferencia
        text: El Delegado informa sobre lo que se trató en la Conferencia. En los años impares, también se celebra en junio el Foro Regional del Noreste.
      - when: septiembre
        title: Taller de montaje
      - when: noviembre
        title: Taller en los años impares, elecciones en los años pares
        text: Cada dos años, la Asamblea Electoral elige al Delegado y al resto de los cargos de la zona. Noviembre es también el mes en que se celebra la Convención Estatal de Massachusetts.
