        url: https://www.aa.org
  - type: faq
    items:
      - q: ¿Qué significan las siglas?
        a: RSG es Representante de Servicios Generales, MCD es Miembro del Comité de Distrito y OSG es la Oficina de Servicios Generales en Nueva York. Hay una lista más larga en el glosario del Manual del Área 30 (en inglés).
      - q: ¿Tengo que ser experto antes de empezar?
        a: No. Nadie espera que lo sepa todo. Lea los folletos de A.A. sobre el grupo y sobre el RSG, conserve el sentido del humor y haga preguntas en su reunión de distrito.
      - q: ¿Dónde encaja el RSG en la estructura de servicio?
        a: La estructura empieza en su grupo. Usted transmite la conciencia del grupo a su MCD y al Delegado del Área, y el Delegado la lleva a la Conferencia de Servicios Generales.
