  - type: callout
    title: La inscripción en la oficina central es un trámite independiente
    body: Al inscribir a su grupo en la oficina central de servicios local o en el intergrupo, solo se informa a dicha oficina. Esto no supone una actualización para el Área, su distrito ni la Oficina de Servicios Generales de Nueva York. Se trata de registros independientes, por lo que deberá actualizar cada uno de ellos.
  - type: text
    heading: Busque un patrocinador del servicio
    body: |
      Del mismo modo que necesitó a alguien que hubiera pasado por lo mismo cuando logró mantenerse sobrio, resulta de gran ayuda contar con alguien que haya vivido esa experiencia en el servicio. Los nuevos RSG suelen sentirse abrumados por la nueva terminología, la literatura y las preguntas: ¿por dónde empiezo?, ¿cómo presento un informe?, ¿cómo encajo esto en una vida ajetreada? Muchos abandonan al cabo de uno o dos meses porque no tenían a nadie a quien preguntar.

      Su padrino o madrina de servicio puede ser un MCD con experiencia, un responsable de área o un antiguo Delegado. No es necesario que sea su padrino o madrina de recuperación, y una mujer puede apadrinar a un hombre en el servicio y viceversa. El contacto puede ser tan frecuente o tan esporádico como desee, y puede recurrir a otra persona a medida que su servicio vaya creciendo.

      Pregunte en su reunión de distrito o envíe un correo electrónico a [info@aaemass.org](mailto:info@aaemass.org), y le ayudaremos a encontrar a alguien.
