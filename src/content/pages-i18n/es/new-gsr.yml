  - type: faq
    items:
      - q: ¿Qué significan las abreviaturas?
        a: RSG son las siglas de «Representante de Servicios Generales», MCD las de «Miembro del Comité de Distrito» y OSG las de «Oficina de Servicios Generales» de Nueva York. En el glosario del Manual de la Área 30 figura una lista más completa.
      - q: ¿Es necesario ser un experto antes de empezar?
        a: No. Nadie espera que lo sepa todo. Lea los folletos de A.A. «El grupo de A.A.» y «RSG (Representante de Servicios Generales)», mantenga el sentido del humor y plantee sus preguntas en la reunión de su distrito.
      - q: ¿Qué lugar ocupa el RSG en la estructura de servicios?
        a: La estructura comienza con su grupo. Usted transmite la conciencia de grupo a su MCD y al Delegado de área, y el Delegado la lleva a la Conferencia de Servicios Generales.
