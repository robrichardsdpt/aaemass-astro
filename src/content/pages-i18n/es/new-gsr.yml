sourceHash: f62c2d3df3f48416
title: Empiece aquí, nuevo RSG | Área 30
description: En qué consiste la labor de un Representante de Servicios Generales (RSG), cómo registrarse como tal en el este de Massachusetts, dónde encontrar el número de servicio de su grupo y quién puede ayudarle a dar los primeros pasos.
eyebrow: Participe
lede: Su grupo le ha elegido para que sea su enlace con el resto de A.A. A continuación le explicamos en qué consiste y cómo ponerse en marcha.
blocks:
  - type: text
    heading: Qué hace un RSG
    body: |
      El Representante de Servicios Generales (RSG) sirve de enlace entre su grupo y A.A. en su conjunto. Usted actúa como portavoz de la Conciencia de grupo y transmite lo que aprende para que el grupo se mantenga informado.

      En la práctica, esto significa:

      - **Acuda a la reunión de su distrito** y comparta la opinión de su grupo con el miembro del Comité de Distrito (MCD).
      - **Acuda a la Asamblea de Área**, donde usted es miembro con derecho a voto. Allí también se reunirá con el Delegado de Área, quien transmite las opiniones de los grupos a la Conferencia de Servicios Generales.
      - **Informe a su grupo** sobre lo que está sucediendo en el distrito, el Área y A.A. a nivel mundial.
      - **Ayude a su grupo a apoyar los servicios.** Colabore con su tesorero en la elaboración de un plan de contribuciones periódicas para el distrito, el Área, su oficina central local o intergrupo y la Oficina de Servicios Generales.
      - **Ayude a los nuevos grupos** que se estén formando en su entorno a conocer los servicios de los que disponen.

      Por encima de todo, un RSG sabe escuchar. Toda la autoridad que existe en A.A. reside en la Conciencia de grupo, y su labor consiste en asegurarse de que se escuche.
  - type: structure
  - type: checklist
    heading: Sus primeros pasos
    items:
      - Informe a su MCD de que es el nuevo RSG de su grupo. Él o ella remitirá sus datos al Registrador de área. ¿No sabe quién es su MCD? Busque su distrito en la página de distritos.
      - O bien, inscríbase en cualquier Asamblea de Área, en el mostrador de inscripción.
      - Averigüe cuál es el número de servicio de su grupo. Pregunte a su MCD, al Registrador del Área o al tesorero del Área. Lo necesitará para cualquier envío que realice al Área 30 o a la Oficina de Servicios Generales de Nueva York; sin él, no se reconocerán las contribuciones de su grupo.
      - Esté atento al kit del RSG. Una vez que se haya inscrito, la Oficina de Servicios Generales envía uno por correo a los nuevos RSG y a sus grupos.
      - Elija una fecha para su primera reunión de distrito y su primera Asamblea de Área (consulte la guía de la Asamblea de Área).
