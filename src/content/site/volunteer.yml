title: 12th Step Volunteer | Treatment Facilities Committee | Area 30
description: Add yourself to the Area 30 Treatment Facilities Committee’s list of AA members willing to do a 12th Step call.
heading: 12th Step Volunteer
eyebrow: Treatment Facilities Committee
lede: The Treatment Committee is assembling a list of folks willing to do a 12th Step call.
trailCommittee: Treatment Facilities
whatTitle: What is this list?
what: Sometimes someone who is still suffering asks for help from AA, and a member is needed to carry the message in person or by phone. This list is for AA members who are willing to be contacted for a 12th Step call.
howTitle: How it works
how:
  - Tell us who you are and where you live, and how to reach you.
  - Tick the times you are usually available.
  - Your details go to the Treatment Facilities Committee.
formTitle: Add yourself to the list
formIntro: Fields marked * are required. Please give a phone number, an email address, or both.
back: Back to the Treatment Facilities Committee
