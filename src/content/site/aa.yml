title: What is AA? Alcoholics Anonymous in Eastern Mass.
description: Alcoholics Anonymous is a fellowship that costs nothing to join. Learn how AA works and find a first meeting in Eastern Massachusetts.
heading: What is AA?
eyebrow: Alcoholics Anonymous
lede: A fellowship of people who come together to solve their drinking problem.
findNear: Find AA near you
learnAa: Learn more on aa.org
costTitle: Does AA cost anything?
costText: There are no age or education requirements to participate. Membership is open to anyone who wants to do something about their drinking problem. AA’s primary purpose is to help alcoholics achieve sobriety.
moreTitle: More about AA
steps:
  title: The Twelve Steps
  text: A set of spiritual principles. Practiced as a way of life, they can expel the obsession to drink and enable the sufferer to recover from alcoholism.
traditions:
  title: The Twelve Traditions
  text: They apply to AA as a whole and outline how AA maintains its unity and relates itself to the world around it.
bigbook:
  title: The Big Book
  text: Describes the AA program of recovery, with stories from the co-founders and from members who have found recovery in AA.
members: Members use the Twelve Steps to maintain sobriety, and groups use the Twelve Traditions to stay unified.
area: Area 30 is Eastern Massachusetts Alcoholics Anonymous General Service.
learnMore: Learn more about AA.
helpTitle: Need help with a drinking problem?
help1: AA has a solution. That isn’t an empty promise. AA has been helping alcoholics recover for more than 80 years. Its program of recovery is built on the simple foundation of one alcoholic sharing with another. If your drinking is out of control, AA can help.
newToAa: New to AA?
firstTitle: Ready for your first meeting?
first1: Anyone with a desire to stop drinking is welcome, regardless of race, gender, sexual orientation, religion, income or profession. You don’t have to pay anything to attend.
first2: You can just sit and listen and learn more about recovery, or you can share about your situation. It’s completely up to you.
enduringTitle: An enduring program of recovery
enduring: AA is based on one alcoholic sharing their experience, strength and hope with another. For more than 80 years, AA has helped millions recover from alcoholism, to get sober and stay sober. AA costs nothing and is supported through member contributions, so there are no dues or fees for membership.
bigBookStories: Big Book stories
grapevineStories: Grapevine stories
contact: Contact Area 30
faqs:
  - q: What is Alcoholics Anonymous?
    a: Alcoholics Anonymous is a fellowship of people who come together to solve their drinking problem. Its primary purpose is to help alcoholics achieve sobriety.
  - q: Does it cost anything to attend AA?
    a: No. It doesn’t cost anything to attend AA meetings, and there are no dues or fees for membership. AA is supported through member contributions.
  - q: Who can join AA?
    a: Anyone with a desire to stop drinking is welcome, regardless of race, gender, sexual orientation, religion, income or profession. There are no age or education requirements.
  - q: What happens at a first AA meeting?
    a: You can just sit and listen and learn more about recovery, or you can share about your situation. It is completely up to you.
  - q: How do I find an AA meeting near me?
    a: Use the meeting finder on aaboston.org. Area 30 is the service area for Eastern Massachusetts and is not itself a meeting.
