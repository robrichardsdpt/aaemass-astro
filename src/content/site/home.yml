about:
  imageAlt: Members of an AA group seated in a circle, hands clasped.
  title: About Area 30
  strong: We are the Alcoholics Anonymous General Service Committee of Eastern Massachusetts.
  p1: "An area is a geographical division within a state or province. A General Service Conference [[delegate|Delegate]] comes from an area. Massachusetts has two: Eastern Mass. (Area 30) and Western Mass. (Area 31). The Delegate is your voice to the General Service Office, AA World Services and the Grapevine."
  p2: Want a new piece of literature? Want to change an existing one? Have a suggestion for a better way to carry the message? Those decisions are made at the General Service Conference, and our Delegate speaks for us there.
register:
  title: Is your group registered with Area 30?
  p1: Being listed on the Meeting Guide app or with Boston Central Service does not mean your group is registered with Area 30 or the General Service Office.
  p2: To register, complete [the group registration form]({registerForm}) and email it to [{registrarEmail}](mailto:{registrarEmail}). Groups that contribute to Area 30 or the General Service Office must be registered and include their ID number with each contribution. Those contributions carry the AA message to members in treatment, in correctional facilities and in remote communities, and to the professionals and public who meet alcoholics first.
