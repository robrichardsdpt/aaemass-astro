treasurer: Contact Area 30’s Treasurer with any questions.
nonTitle: Non-AA members
non: Area 30 respectfully declines contributions from non-AA members in accordance with our Seventh Tradition and self-support. If you are interested in learning more about our recovery program, please reach out.
