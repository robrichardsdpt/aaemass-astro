traditionTitle: Contributions and self-support
tradition: "AA’s [[seventh|Seventh Tradition]] states: “Every AA group ought to be fully self-supporting, declining outside contributions.” This means that only AA members contribute financially to AA, and even AA members are limited in the amount they can contribute. This keeps AA free of outside influences that might divert us from our primary purpose: to help the alcoholic who still suffers. The amount of the contribution is secondary to the spiritual connection that unites all groups around the world."
moneyTitle: Where money and spirituality mix
money: Members celebrate sobriety by giving time, energy and money in support of carrying the AA message. Members assure that group expenses are paid by voluntarily putting money into the basket passed at each meeting. Contributions support the group and AA worldwide.
pamphletLink: Read the pamphlet on aa.org
ensure: Contributions ensure that
onlineTitle: How do I contribute online?
online: Use the form that matches who is giving. If you do not know your group number, email [{registrarEmail}](mailto:{registrarEmail}). A committee or a cluster of groups should use the District form and add details in the sub-district field. Questions about finances go to [treasurer@aaemass.org](mailto:treasurer@aaemass.org).
secureForm: Secure online form
paypalNote: These forms are sent through the Area 30 website and continue to PayPal’s secure payment page. Area 30 never sees or stores your card details.
mailTitle: Can I mail a contribution?
mail: Yes. Send a check to **General Service Committee of Eastern MA, PO Box 51411, Boston, MA 02205**. Checks may be made payable to **General Service Committee of Eastern MA**. We appreciate your support!
