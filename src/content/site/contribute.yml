title: Contribute to Area 30 | Seventh Tradition
description: Contribute to Area 30 as an AA group, member or district. Learn how the Seventh Tradition keeps AA fully self-supporting.
heading: Contributions and self-support
eyebrow: Seventh Tradition
lede: Every AA group ought to be fully self-supporting, declining outside contributions.
contributeOnline: Contribute online
readPamphlet: Read the pamphlet
faqs:
  - q: Who can contribute to Area 30?
    a: Only AA members, groups and districts. Area 30 respectfully declines contributions from non-AA members, in keeping with the Seventh Tradition and self-support.
  - q: What is the Seventh Tradition?
    a: It states that every AA group ought to be fully self-supporting, declining outside contributions. Even AA members are limited in the amount they can contribute.
  - q: How do I contribute online?
    a: Use the group, member or district form that matches who is giving. You will need your group number, which the Registrar can look up at registrar@aaemass.org.
  - q: What do contributions pay for?
    a: Contributions help groups get meeting space, phones get answered, people in custody get Big Books, professionals get correct information about AA, lone members get letters and newcomers get literature and meeting lists.
gives:
