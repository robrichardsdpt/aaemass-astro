meets: The Area 30 committee meets {when} at the {where}. Each committee’s own meeting time is on its page under [Committees](/committees).
faqs:
  - q: Can any AA member attend Area 30 committee meetings?
    a: Yes. All AA members are welcome at Area 30 committee meetings, and committees are always looking for people to help.
  - q: Where can I find a committee’s meeting time?
    a: Each committee’s page lists its monthly meeting time, and the calendar above shows events, assemblies and committee meetings as they are scheduled.
  - q: How do I add the calendar to my phone?
    a: Use the “Add to Google Calendar” button at the top of this page to subscribe.
