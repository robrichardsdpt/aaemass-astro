  - type: faq
    items:
      - q: What do the abbreviations mean?
        a: GSR is General Service Representative, DCM is District Committee Member and GSO is the General Service Office in New York. A longer list is in the glossary in the Area 30 Handbook.
      - q: Do I have to be an expert before I start?
        a: No. Nobody expects you to know it all. Read the AA pamphlets The AA Group and GSR (General Service Representative), keep a sense of humor and ask questions at your district meeting.
      - q: Where does the GSR fit in the service structure?
        a: The structure starts with your group. You pass the group's conscience to your DCM and the Area Delegate, and the Delegate takes it to the General Service Conference.
